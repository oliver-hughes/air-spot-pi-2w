# Managed by air-spot-pi-2w bootstrap. Drop-in for the unit shipped by
# shairport-sync's own `make install` -- we don't own that file, so we extend it
# rather than replace it.

[Unit]
# Bring CamillaDSP up first so it owns the loopback's rate and format before
# shairport-sync opens the other side. Both ends are pinned to the same values,
# so a mismatch shouldn't be possible -- this just removes the ambiguity.
#
# Wants, not Requires: if CamillaDSP is broken we'd still rather shairport-sync
# started and advertised itself, so the device appears and you have something
# to debug rather than silence and no AirPlay target at all.
After=camilladsp.service
Wants=camilladsp.service

[Service]
# shairport-sync feeds a real-time consumer. Give it enough priority to keep
# the loopback fed when the USB ethernet adapter is busy (DESIGN.md 9.1),
# but below CamillaDSP, which is closer to the hardware deadline.
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=10
